<div class="container py-4" *ngIf="!isLoading; else loading">
  
  <!-- Course Title -->
  <h2 class="mb-3">{{ course.title }}</h2>
  <p class="text-muted">{{ course.description }}</p>

  <div class="row">
    
    <!-- Sidebar Lessons -->
    <div class="col-md-4">
      <div class="list-group shadow-sm">

        <button 
          *ngFor="let lesson of lessons"
          class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
          [class.active]="lesson === currentLesson"
          (click)="openLesson(lesson)"
        >
          <span>
            <i class="bi bi-play-circle me-2"></i>
            {{ lesson.title }}
          </span>

          <i 
            *ngIf="enrollment.completedLessons.includes(lesson.order)"
            class="bi bi-check-circle-fill text-success"
          ></i>
        </button>

      </div>
    </div>

    <!-- Lesson Viewer -->
    <div class="col-md-8">

      <div *ngIf="currentLesson; else finished">
        <h4>{{ currentLesson.title }}</h4>

        <p class="text-muted">{{ currentLesson.description }}</p>

        <!-- ARTICLE CONTENT -->
        <div *ngIf="currentLesson.type === 'article'">
          <p>{{ currentLesson.content }}</p>
        </div>

        <!-- VIDEO -->
        <div *ngIf="currentLesson.type === 'video'">
          <video 
            controls 
            class="w-100 rounded"
            *ngIf="currentLesson.videoUrl"
          >
            <source [src]="currentLesson.videoUrl" type="video/mp4" />
          </video>
        </div>

        <button class="btn btn-success mt-3" (click)="completeLesson()">
          Mark as Complete
        </button>
      </div>

      <!-- Course Completed -->
      <ng-template #finished>
        <div class="text-center mt-5">
          <i class="bi bi-trophy-fill text-warning" style="font-size: 4rem;"></i>
          <h3 class="mt-3">Course Completed!</h3>
        </div>
      </ng-template>

    </div>
  </div>

</div>

<ng-template #loading>
  <div class="text-center py-5">
    <div class="spinner-border text-primary"></div>
  </div>
</ng-template>
<app-student-footer></app-student-footer>
