<div class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="auth-card card border-0 shadow-lg">
          <div class="card-header bg-theme-primary text-white text-center py-4">
            <div class="auth-logo mb-3">
              <i class="bi bi-person-plus-fill display-4"></i>
            </div>
            <h2 class="fw-bold mb-0">Create Account</h2>
            <p class="mb-0 opacity-75">Join thousands of learners today</p>
          </div>
          
          <div class="card-body p-5">
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
              <div class="row">
                <!-- First Name -->
                <div class="col-md-6 mb-4">
                  <label for="firstName" class="form-label fw-semibold">First Name</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light">
                      <i class="bi bi-person text-muted"></i>
                    </span>
                    <input type="text" class="form-control" id="firstName" formControlName="firstName"
                           placeholder="First name" [class]="getValidationClass('firstName')">
                  </div>
                  <div *ngIf="registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched" 
                       class="text-danger small mt-1">
                    First name is required
                  </div>
                </div>

                <!-- Last Name -->
                <div class="col-md-6 mb-4">
                  <label for="lastName" class="form-label fw-semibold">Last Name</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light">
                      <i class="bi bi-person text-muted"></i>
                    </span>
                    <input type="text" class="form-control" id="lastName" formControlName="lastName"
                           placeholder="Last name" [class]="getValidationClass('lastName')">
                  </div>
                  <div *ngIf="registerForm.get('lastName')?.invalid && registerForm.get('lastName')?.touched" 
                       class="text-danger small mt-1">
                    Last name is required
                  </div>
                </div>
              </div>

              <!-- Email -->
              <div class="mb-4">
                <label for="email" class="form-label fw-semibold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light">
                    <i class="bi bi-envelope text-muted"></i>
                  </span>
                  <input type="email" class="form-control" id="email" formControlName="email"
                         placeholder="Enter your email" [class]="getValidationClass('email')">
                </div>
                <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" 
                     class="text-danger small mt-1">
                  Please enter a valid email address
                </div>
              </div>

              <!-- Role Selection -->
              <div class="mb-4">
                <label class="form-label fw-semibold">I want to join as</label>
                <div class="role-selection">
                  <div class="row g-3">
                    <div class="col-6" *ngFor="let role of roles">
                      <input type="radio" class="btn-check" name="role" [id]="'role-' + role.value" 
                             [value]="role.value" formControlName="role" autocomplete="off">
                      <label class="btn btn-outline-primary w-100 h-100 p-3" [for]="'role-' + role.value">
                        <i class="bi" 
                           [class.bi-person]="role.value === 'student'"
                           [class.bi-person-badge]="role.value === 'instructor'"
                           class="d-block mb-2 fs-5"></i>
                        <span class="small fw-semibold">{{ role.label }}</span>
                        <br>
                        <span class="text-muted x-small">{{ role.description }}</span>
                      </label>
                    </div>
                  </div>
                </div>
                <div *ngIf="registerForm.get('role')?.invalid && registerForm.get('role')?.touched" 
                     class="text-danger small mt-1">
                  Please select your role
                </div>
              </div>

              <!-- Password -->
              <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light">
                    <i class="bi bi-lock text-muted"></i>
                  </span>
                  <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="password" 
                         formControlName="password" placeholder="Create a password"
                         [class]="getValidationClass('password')">
                  <button class="btn btn-outline-secondary" type="button" 
                          (click)="togglePasswordVisibility()">
                    <i class="bi" [class]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                  </button>
                </div>
                <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" 
                     class="text-danger small mt-1">
                  Password must be at least 6 characters
                </div>
              </div>

              <!-- Confirm Password -->
              <div class="mb-4">
                <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light">
                    <i class="bi bi-lock-fill text-muted"></i>
                  </span>
                  <input type="password" class="form-control" id="confirmPassword" 
                         formControlName="confirmPassword" placeholder="Confirm your password"
                         [class]="getValidationClass('confirmPassword')">
                </div>
                <div *ngIf="registerForm.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched" 
                     class="text-danger small mt-1">
                  Passwords do not match
                </div>
              </div>

              <!-- Terms and Conditions -->
              <div class="mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="terms" formControlName="terms">
                  <label class="form-check-label small" for="terms">
                    I agree to the 
                    <a href="#" class="text-theme-primary text-decoration-none">Terms of Service</a> 
                    and 
                    <a href="#" class="text-theme-primary text-decoration-none">Privacy Policy</a>
                  </label>
                </div>
                <div *ngIf="registerForm.get('terms')?.invalid && registerForm.get('terms')?.touched" 
                     class="text-danger small mt-1">
                  You must accept the terms and conditions
                </div>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn btn-primary btn-lg w-100 mb-4" 
                      [disabled]="registerForm.invalid || isLoading">
                <span *ngIf="!isLoading">
                  <i class="bi bi-person-plus me-2"></i>
                  Join as {{ getRoleLabel(registerForm.get('role')?.value) }}
                </span>
                <span *ngIf="isLoading">
                  <i class="bi bi-arrow-repeat spinner me-2"></i>Creating Account...
                </span>
              </button>

              <!-- Login Link -->
              <div class="text-center">
                <p class="text-muted mb-0">
                  Already have an account? 
                  <a routerLink="/login" class="text-theme-primary fw-semibold text-decoration-none">
                    Sign in here
                  </a>
                </p>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<auth-footer></auth-footer>
